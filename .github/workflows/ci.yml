name: CI Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: deckstorm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file for tests
        run: |
          cat > .env << EOF
          NODE_ENV=test
          PORT=3333
          HOST=localhost
          APP_KEY=test-app-key-32-characters-long
          LOG_LEVEL=silent
          SESSION_DRIVER=memory
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_USER=root
          DB_PASSWORD=root
          DB_DATABASE=deckstorm_test
          GOOGLE_CLIENT_ID=test
          GOOGLE_CLIENT_SECRET=test
          GITHUB_CLIENT_ID=test
          GITHUB_CLIENT_SECRET=test
          LIMITER_STORE=memory
          EOF

      - name: Run migrations
        run: node ace migration:run --force

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Upload coverage
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file for build
        run: |
          cat > .env << EOF
          NODE_ENV=production
          PORT=3333
          HOST=localhost
          APP_KEY=test-app-key-32-characters-long
          LOG_LEVEL=silent
          SESSION_DRIVER=memory
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_USER=root
          DB_PASSWORD=root
          DB_DATABASE=deckstorm_test
          LIMITER_STORE=memory
          EOF

      - name: Build application
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -d "build" ]; then
            echo "Build directory not found!"
            exit 1
          fi
          echo "✅ Build successful!"
