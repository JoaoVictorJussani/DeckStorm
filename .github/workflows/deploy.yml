name: Deploy to Production

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: deckstorm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env file for tests
        run: |
          cat > .env << EOF
          NODE_ENV=test
          PORT=3333
          HOST=localhost
          APP_KEY=test-app-key-32-characters-long
          LOG_LEVEL=silent
          SESSION_DRIVER=memory
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_USER=root
          DB_PASSWORD=root
          DB_DATABASE=deckstorm_test
          LIMITER_STORE=memory
          EOF

      - name: Run linter
        run: npm run lint

      - name: Run migrations
        run: node ace migration:run --force

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Synchroniser le code source avec le serveur (exclure les dossiers inutiles pour Docker)
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'build/' \
            --exclude 'tmp/' \
            --exclude '.env' \
            ./ $SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/

          # Se connecter et mettre à jour via Docker
          ssh $SERVER_USER@$SERVER_HOST << 'EOF'
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Recréer le fichier .env si nécessaire (on suppose ici qu'il est déjà sur le serveur)
            # Sinon, on pourrait injecter des secrets GitHub ici
            
            # Lancer le déploiement Docker
            docker-compose -f docker-compose.prod.yml up -d --build
            
            # Nettoyer les anciennes images inutilisées
            docker image prune -f
            
            # Exécuter les migrations à l'intérieur du conteneur
            # Utilise 'exec -T' pour le mode non-interactif
            docker-compose -f docker-compose.prod.yml exec -T app node ace migration:run --force
          EOF

      - name: Verify deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh $SERVER_USER@$SERVER_HOST << 'EOF'
            docker-compose -f ${{ secrets.DEPLOY_PATH }}/docker-compose.prod.yml ps
          EOF

      - name: Notify deployment success
        if: success()
        run: echo "✅ Deployment via Docker successful!"

      - name: Notify deployment failure
        if: failure()
        run: echo "❌ Deployment failed!"
