# Created by : CSR
# Description : Create two containers (one for the db and the other one of the administration front-end)
#
services:
  db:
    image: postgres:15
    container_name: db_flashcards
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_USER: root
      POSTGRES_DB: db_flashcards
      PGDATA: /var/lib/postgresql/data/pgdata
    restart: always
    ports:
      - '5432:5432'
    networks:
      - flashcards_network
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts:/scripts
  adminer:
    image: adminer
    container_name: adminer_flashcards
    links:
      - db
    restart: always
    ports:
      - 8081:8080
    networks:
      - flashcards_network
  adonis:
    container_name: adonis_flashcards
    build:
      context: .
      dockerfile: adonis.dockerfile
    restart: always
    ports:
      - 3333:3333
    networks:
      - flashcards_network
    environment:
      - HOST=0.0.0.0
      - PORT=3333
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_DATABASE=db_flashcards
    depends_on:
      - db

# The database will be persistent among containers restarts.
volumes:
  pgdata:

networks:
  flashcards_network:
    driver: bridge
